[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevalkit"
version = "0.1.0"
description = "Reproducible evaluation of typed text, image and video decision models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
api = ["pillow>=10"]
hf = ["torch>=2.6", "torchvision>=0.21", "transformers>=5.4", "huggingface-hub>=0.26", "pillow", "av>=16.1", "safetensors", "accelerate"]
data = ["huggingface-hub>=0.26", "datasets>=3", "pyarrow>=18"]
decision-index = ["decision-index[vision] @ git+https://github.com/apolinario/decision-index.git@25c6ec7b6b5f44a216c63c3a700de3a9c6d6699d", "httpx[socks]>=0.27,<1"]
test = ["pytest>=8"]

[project.scripts]
jeval = "jevalkit.cli:main"

[tool.setuptools.packages.find]
include = ["jevalkit*"]

[tool.setuptools.package-data]
"*" = ["manifest.json"]
"jevalkit.datasets.jevbench.official" = ["LICENSE"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
